      rel="stylesheet"
    />

    <!-- Anti-FOUC Theme Boot Script -->
    <script>
      (function () {
        var tema = 'dark';
        try {
          var saved = localStorage.getItem('radpraktik:v1:tema');
          if (saved === 'light' || saved === 'dark') {
            tema = saved;
          } else {
            var raw = localStorage.getItem('radpraktik:v1:progress');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && (parsed.tema === 'light' || parsed.tema === 'dark')) {
                tema = parsed.tema;
              }
            }
          }
        } catch (e) {
          tema = 'dark';
        }
        var root = document.documentElement;
        root.dataset.theme = tema;
        if (tema === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', tema === 'dark' ? '#0B0F14' : '#F6F7F4');
        }
      })();
    </script>

    <!-- Structured Data: Organization & WebSite -->
